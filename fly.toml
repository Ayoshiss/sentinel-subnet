app = "tao-gateway"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  SIDECAR_PORT = "8001"
  SIDECAR_URL = "http://localhost:8001"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "20s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
