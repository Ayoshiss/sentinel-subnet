app = "tao-gateway"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  SIDECAR_PORT = "8001"
  SIDECAR_URL = "http://localhost:8001"

[http_service]
  internal_port = 8080
  force_https = true
  # Guardian path — keep machines warm. Auto-stop caused the LB to route to a
  # cold machine and drop the first connections (scan failures = the agent
  # walking into trades unverified). Safety service must always be reachable.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "15s"
    interval = "20s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
