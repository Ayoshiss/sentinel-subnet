app = "tao-gateway"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"
  SIDECAR_PORT = "8001"
  SIDECAR_URL = "http://localhost:8001"

[http_service]
  internal_port = 8080
  force_https = true

  # Idle posture. Two always-on machines were kept warm for a live demo, because
  # auto-stop routed the first request to a cold machine and the scan failed,
  # and a scan that fails is an agent trading unverified. With no live traffic
  # that is roughly $6.40/month buying nothing, so the machines suspend when idle
  # and wake on the first request.
  #
  # Before any demo or investor call, flip back to a warm path for the day:
  #   auto_stop_machines = "off"
  #   min_machines_running = 2
  # Cold starts are cheap to accept when nobody is watching, and expensive
  # exactly when someone is.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "20s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
