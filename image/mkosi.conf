# The measured Sentinel miner image.
#
# One signed UKI boots a read-only root filesystem whose dm-verity root hash is
# on the UKI's embedded command line. The UKI is what the TDX firmware measures,
# so the quote covers the kernel, the initrd, the command line and, through the
# root hash, every file the miner runs. That is what closes T23.
#
# Reproducible: the package snapshot, the timestamp and the partition seed are
# fixed, so anyone can rebuild this and get the same UKI digest. image/build.sh
# builds it; signing for Secure Boot is a separate step that does not change the
# digest. There is no SSH, no guest agent and no login: an operator configures a
# miner through instance metadata, as data (scripts/miner_from_metadata.py).

[Distribution]
Distribution=ubuntu
Release=noble
Architecture=x86-64
Mirror=https://snapshot.ubuntu.com/ubuntu/20261106T000000Z

[Output]
Format=disk
ImageId=sentinel-miner
Output=sentinel-miner
OutputDirectory=mkosi.output
SplitArtifacts=uki
Seed=c1cd4080-4092-5eec-8044-a1aedfc7688c

[Build]
# Caches the tools tree and installed packages between builds. Changes speed,
# not output.
Incremental=yes
CacheDirectory=mkosi.cache
ToolsTree=default
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=noble
ToolsTreeMirror=https://snapshot.ubuntu.com/ubuntu/20261106T000000Z
# mkosi.sandbox pins the security pocket too; see the file for why.
ToolsTreeSandboxTrees=mkosi.sandbox
WithNetwork=yes
BuildSources=..:sentinel

[Content]
SourceDateEpoch=1793923200
Bootable=yes
Bootloader=uki
# systemd.volatile=state: /var is a tmpfs and everything else is the verified
# root. No root= here: mkosi adds roothash= and the initrd finds both
# partitions from it. rd.emergency=reboot and no shells, so a failed boot does
# not hand anyone a prompt.
KernelCommandLine=console=ttyS0,115200 panic=-1 systemd.volatile=state rd.emergency=reboot systemd.crash_reboot=1 sentinel.image=1
Packages=
        linux-image-gcp
        systemd
        systemd-boot-efi
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        ca-certificates
        python3
BuildPackages=
        python3-venv
        python3-pip
RemoveFiles=
        /var/log/*
        /var/cache/*
        /var/lib/apt/lists/*
        /usr/share/doc
        /usr/share/man
