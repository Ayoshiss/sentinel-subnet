[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:sidecar]
command=python /sidecar/main.py
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=1

[program:gateway]
command=/gateway
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=2
startsecs=3
