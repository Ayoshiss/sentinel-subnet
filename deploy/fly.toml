# fly.toml — TAO Gateway  [STALE — NOT WHAT IS DEPLOYED]
#
# The live app uses the fly.toml at the repo root. This file predates it: it
# uses the older [[services]] block, points at ../gateway/Dockerfile rather than
# Dockerfile.fly, and carries no auto-stop settings, so deploying it would
# change the machine posture without meaning to.
#
# Kept only as a record of the original launch. Edit the root fly.toml instead.

app = "tao-gateway"
primary_region = "sjc"  # San Jose — close to most Bittensor validators

[build]
  dockerfile = "../gateway/Dockerfile"

[env]
  PORT = "8080"
  SIDECAR_URL = "http://localhost:8001"  # sidecar runs as a process group on same VM

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [services.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"
